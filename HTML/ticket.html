<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Conf | Your Ticket</title>

    <link rel="icon" type="image/png" href="../assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="../css/style.css">

    <script src="../js/ticket.js" defer></script>
</head>

<body>

    <header class="site-header">
        <nav class="navBar" aria-label="Main navigation">
            <a href="index.html" class="logo">
                <img src="../assets/images/logo-full.svg" alt="Coding Conf logo">
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="ticket-section">

            <h1 id="congratulations">
                Congrats! Your ticket is ready.
            </h1>

            <p class="ticket-description">
                Your registration for Coding Conf 2026 is complete.
                We look forward to seeing you!
            </p>

            <article class="ticket-card">

                <div class="ticket-content">

                    <img src="../assets/images/logo-full.svg"
                         alt="Coding Conf logo"
                         class="ticket-logo">

                    <p class="ticket-event-details">
                        October 26, 2026 | Papine, Kgn
                    </p>

                    <div class="attendee-details">

                        <img id="ticket-avatar"
                             src=""
                             alt="Attendee avatar"
                             class="ticket-avatar">

                        <div>
                            <h2 id="ticket-name">Attendee Name</h2>
                            <img src="../assets/images/icon-github.svg" alt="" class="github-icon">
                            <a id="ticket-github" href="#" target="_blank"
                                rel="noopener noreferrer">@username</a>
                        </div>

                    </div>

                </div>

                <p class="ticket-number" id="ticket-number">
                    #01609
                </p>

            </article>

            <p class="ticket-note">
                Keep your ticket available for the event.
            </p>

            <a href="index.html" class="register-btn ticket-home-link">
                Back to Home
            </a>

        </section>
    </main>

    <footer class="site-footer">
        <p>Designed and built by Avalei March</p>
    </footer>

</body>
</html>
